basePath: /
definitions:
  github_com_mhmadamrii_kommers_server_internal_model.DiscountType:
    enum:
    - percent
    - fixed
    type: string
    x-enum-varnames:
    - DiscountTypePercent
    - DiscountTypeFixed
  github_com_mhmadamrii_kommers_server_internal_model.OrderStatus:
    enum:
    - pending
    - paid
    - cancelled
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusCancelled
  github_com_mhmadamrii_kommers_server_internal_model.PaymentStatus:
    enum:
    - pending
    - paid
    - failed
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusPaid
    - PaymentStatusFailed
  github_com_mhmadamrii_kommers_server_internal_model.Role:
    enum:
    - customer
    - seller
    - admin
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleSeller
    - RoleAdmin
  internal_handler.addCartItemRequest:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  internal_handler.addressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      label:
        type: string
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      recipient:
        type: string
      state:
        type: string
    required:
    - city
    - country
    - line1
    - phone
    - postal_code
    - recipient
    type: object
  internal_handler.addressResponse:
    properties:
      city:
        type: string
      country:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      label:
        type: string
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      recipient:
        type: string
      state:
        type: string
    type: object
  internal_handler.applySellerRequest:
    properties:
      accept_terms:
        type: boolean
    required:
    - accept_terms
    type: object
  internal_handler.authResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_handler.userResponse'
    type: object
  internal_handler.campaignRequest:
    properties:
      category_id:
        description: |-
          Exactly one of these two must be set — a campaign targets either a
          whole category or an explicit list of products, never both.
        type: integer
      discount_type:
        allOf:
        - $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.DiscountType'
        enum:
        - percent
        - fixed
      discount_value:
        type: integer
      ends_at:
        type: string
      free_shipping:
        type: boolean
      name:
        type: string
      product_ids:
        items:
          type: integer
        type: array
      starts_at:
        type: string
      stock_limit:
        type: integer
    required:
    - discount_type
    - discount_value
    - ends_at
    - name
    - starts_at
    type: object
  internal_handler.campaignResponse:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      discount_type:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.DiscountType'
      discount_value:
        type: integer
      ends_at:
        type: string
      free_shipping:
        type: boolean
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      product_ids:
        items:
          type: integer
        type: array
      starts_at:
        type: string
      stock_limit:
        type: integer
      stock_used:
        type: integer
    type: object
  internal_handler.cartItemResponse:
    properties:
      id:
        type: integer
      image_url:
        type: string
      price_cents:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      product_slug:
        type: string
      quantity:
        type: integer
      subtotal_cents:
        type: integer
    type: object
  internal_handler.cartResponse:
    properties:
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/internal_handler.cartItemResponse'
        type: array
      total_cents:
        type: integer
    type: object
  internal_handler.categoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  internal_handler.categoryResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  internal_handler.checkoutRequest:
    properties:
      address_id:
        type: integer
    required:
    - address_id
    type: object
  internal_handler.checkoutResponse:
    properties:
      address:
        $ref: '#/definitions/internal_handler.addressResponse'
      address_id:
        type: integer
      checkout_url:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/internal_handler.orderItemResponse'
        type: array
      payment_status:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.PaymentStatus'
      status:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.OrderStatus'
      total_cents:
        type: integer
    type: object
  internal_handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.orderItemResponse:
    properties:
      campaign_id:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      price_cents:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      product_slug:
        type: string
      quantity:
        type: integer
      seller_name:
        type: string
      subtotal_cents:
        type: integer
    type: object
  internal_handler.orderResponse:
    properties:
      address:
        $ref: '#/definitions/internal_handler.addressResponse'
      address_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/internal_handler.orderItemResponse'
        type: array
      payment_status:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.PaymentStatus'
      status:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.OrderStatus'
      total_cents:
        type: integer
    type: object
  internal_handler.ownerResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
    type: object
  internal_handler.productImageResponse:
    properties:
      id:
        type: integer
      is_primary:
        type: boolean
      sort_order:
        type: integer
      url:
        type: string
    type: object
  internal_handler.productRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      free_shipping:
        type: boolean
      is_active:
        type: boolean
      location:
        type: string
      name:
        type: string
      price_cents:
        type: integer
      stock:
        minimum: 0
        type: integer
    required:
    - category_id
    - name
    - price_cents
    type: object
  internal_handler.productResponse:
    properties:
      average_rating:
        description: |-
          AverageRating/ReviewCount are computed from real Review rows — zero
          when nobody has reviewed yet, never a placeholder or fabricated value.
        type: number
      campaign_ends_at:
        type: string
      campaign_id:
        type: integer
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      effective_price_cents:
        type: integer
      free_shipping:
        type: boolean
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/internal_handler.productImageResponse'
        type: array
      is_active:
        type: boolean
      location:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/internal_handler.ownerResponse'
      price_cents:
        description: |-
          PriceCents is the base price; EffectivePriceCents is what a buyer pays
          right now (equal to PriceCents when no campaign is live).
        type: integer
      review_count:
        type: integer
      slug:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  internal_handler.registerRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  internal_handler.reviewEligibilityResponse:
    properties:
      already_reviewed:
        type: boolean
      can_review:
        type: boolean
    type: object
  internal_handler.reviewImageResponse:
    properties:
      id:
        type: integer
      url:
        type: string
    type: object
  internal_handler.reviewRequest:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rating
    type: object
  internal_handler.reviewResponse:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/internal_handler.reviewImageResponse'
        type: array
      product_id:
        type: integer
      rating:
        type: integer
      reviewer_name:
        type: string
    type: object
  internal_handler.updateCartItemRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  internal_handler.updateProfileRequest:
    properties:
      full_name:
        type: string
    required:
    - full_name
    type: object
  internal_handler.userResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        $ref: '#/definitions/github_com_mhmadamrii_kommers_server_internal_model.Role'
    type: object
info:
  contact: {}
  description: E-commerce backend API for kommers.
  title: Kommers API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate and receive a JWT
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Clear the auth cookie
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user account
      tags:
      - auth
  /api/v1/campaigns:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.campaignResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List campaigns (admin sees all, seller sees their own)
      tags:
      - campaigns
    post:
      consumes:
      - application/json
      parameters:
      - description: Campaign payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.campaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.campaignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 'Create a promotion campaign (admin: any target; seller: own products
        only)'
      tags:
      - campaigns
  /api/v1/campaigns/{id}:
    delete:
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a campaign (admin, or the owning seller)
      tags:
      - campaigns
  /api/v1/cart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.cartResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user's cart
      tags:
      - cart
  /api/v1/cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.cartResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a product to the cart (or increase quantity if already present)
      tags:
      - cart
  /api/v1/cart/items/{id}:
    delete:
      parameters:
      - description: Cart item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove an item from the cart
      tags:
      - cart
    put:
      consumes:
      - application/json
      parameters:
      - description: Cart item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Quantity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.cartResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a cart item's quantity
      tags:
      - cart
  /api/v1/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.categoryResponse'
            type: array
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.categoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.categoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a category (admin only)
      tags:
      - categories
  /api/v1/checkout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Checkout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.checkoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.checkoutResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Convert the current cart into an order and start a Stripe Checkout
        Session
      tags:
      - orders
  /api/v1/dev/seed:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Seed dev data — admin+seller users, categories, products (idempotent;
        only mounted when ENV=development)
      tags:
      - dev
  /api/v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.userResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user's profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.userResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update the current user's profile
      tags:
      - profile
  /api/v1/me/addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.addressResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the current user's addresses
      tags:
      - addresses
    post:
      consumes:
      - application/json
      parameters:
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.addressResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a new address
      tags:
      - addresses
  /api/v1/me/addresses/{id}:
    delete:
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an address
      tags:
      - addresses
    put:
      consumes:
      - application/json
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.addressResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an address
      tags:
      - addresses
  /api/v1/me/products:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.productResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List the authenticated seller's own products (active and inactive)
      tags:
      - products
  /api/v1/orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.orderResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the current user's orders
